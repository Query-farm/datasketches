name: Main Extension Distribution Pipeline
on:
  push:
    branches:
    - v2.0
  pull_request: null
  workflow_dispatch:
    inputs:
      dry_run:
        description: Sign and verify, but upload nothing to the Query.Farm repository
        type: boolean
        default: false
  schedule:
  - cron: 0 2 * * *
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{
    github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true
jobs:
  codegen-check:
    name: Generated code matches codegen/generator.py
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Regenerate
      run: |
        python3 -m pip install jinja2
        python3 codegen/generator.py
    - name: Fail if the generated files differ from the committed ones
      run: |
        git status --porcelain -- src/generated src/generated.cpp test/sql/datasketch_generated_examples.test
        test -z "$(git status --porcelain -- src/generated src/generated.cpp test/sql/datasketch_generated_examples.test)"
  duckdb-stable-build:
    name: Build extension binaries
    uses: Query-farm/extension-ci-tools/.github/workflows/build.yml@query-farm
    with:
      duckdb_version: v2.0.0
      ci_tools_version: query-farm
      groups: |
        main:
          config: extension_config.cmake
          toolchain: main
    secrets:
      ccache_remote_token: ${{ secrets.QUERY_FARM_CCACHE_TOKEN }}
  duckdb-deploy:
    name: Deploy to duckdb-extensions.query.farm
    needs: [codegen-check, duckdb-stable-build]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/v2.0' || startsWith(github.ref, 'refs/tags/'))
    uses: Query-farm/extension-ci-tools/.github/workflows/_query_farm_deploy.yml@query-farm
    with:
      extension_name: datasketches
      duckdb_version: v2.0.0
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      signing_key: ${{ secrets.QUERY_FARM_EXTENSION_SIGNING_KEY }}
      r2_access_key_id: ${{ secrets.QUERY_FARM_R2_ACCESS_KEY_ID }}
      r2_secret_access_key: ${{ secrets.QUERY_FARM_R2_SECRET_ACCESS_KEY }}
